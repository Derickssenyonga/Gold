name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-11-jdk \
          build-essential \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          libpng-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libwebp-dev \
          libtiff-dev \
          cython3 \
          ccache
    
    - name: Set up Android SDK
      run: |
        cd $HOME
        mkdir -p Android/sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip -d Android/sdk/cmdline-tools
        mv Android/sdk/cmdline-tools/cmdline-tools Android/sdk/cmdline-tools/latest
        rm commandlinetools-linux-10406996_latest.zip
        
        export PATH=$HOME/Android/sdk/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909125"
    
    - name: Install buildozer and dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython
    
    - name: Build APK
      run: |
        cd android_app
        export ANDROID_HOME=$HOME/Android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        buildozer android debug
      timeout-minutes: 60
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: goldscalper-apk
        path: android_app/bin/goldscalper*.apk
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android_app/bin/goldscalper*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
