name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Gold Scalper APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libwebp-dev \
            libtiff-dev

      - name: Check Java
        run: |
          java -version

      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Cython
        run: |
          pip install "Cython==0.29.34"

      - name: Install Buildozer
        run: |
          pip install "buildozer==1.6.0"

      - name: Build APK
        working-directory: android_app
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Scalper-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
