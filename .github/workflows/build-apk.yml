name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip libssl-dev libjpeg-dev zlib1g-dev libpng-dev libfreetype6-dev libharfbuzz-dev libwebp-dev libtiff-dev cython3 ccache build-essential libffi-dev
          pip install --upgrade pip
          pip install buildozer cython
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;26.1.10909125"

      - name: Build APK
        run: |
          cd android_app
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldscalper-apk
          path: android_app/bin/*.apk
