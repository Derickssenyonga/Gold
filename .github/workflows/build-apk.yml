name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libssl-dev libjpeg-dev zlib1g-dev libpng-dev libfreetype6-dev libharfbuzz-dev libwebp-dev libtiff-dev cython3 ccache build-essential libffi-dev
          pip install --upgrade pip
          pip install buildozer cython
      - name: Set up Android SDK
        run: |
          cd $HOME
          mkdir -p Android/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip -d Android/sdk/cmdline-tools
          mv Android/sdk/cmdline-tools/cmdline-tools Android/sdk/cmdline-tools/latest
          rm commandlinetools-linux-10406996_latest.zip
          echo "ANDROID_HOME=$HOME/Android/sdk" >> $GITHUB_ENV
          echo "$HOME/Android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/Android/sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;26.1.10909125"
      - name: Build APK
        run: |
          cd android_app
          export ANDROID_HOME=$HOME/Android/sdk
          export PATH=$HOME/Android/sdk/cmdline-tools/latest/bin:$PATH
          buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldscalper-apk
          path: android_app/bin/*.apk
