name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Gold Scalper APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libwebp-dev \
            libtiff-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.34"
          pip install "buildozer==1.6.0"

      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          echo "Downloading Android command line tools..."

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/cmdline-tools.zip

          mkdir -p /tmp/cmdline-tools

          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest"

          mv /tmp/cmdline-tools/cmdline-tools \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android Build Tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;37.0.0"

      - name: Verify Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print

      - name: Build APK
        working-directory: android_app
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: Show APK
        run: |
          find android_app/bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldScalper-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
