name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libpng-dev \
            libwebp-dev \
            libtiff-dev \
            libharfbuzz-dev \
            ccache

      - name: Check Java
        run: |
          java -version

      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Cython
        run: |
          pip install "Cython==0.29.34"

      - name: Install Buildozer
        run: |
          pip install buildozer==1.6.0

      - name: Accept Android licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"

          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
