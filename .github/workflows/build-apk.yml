name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Gold Scalper APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libwebp-dev \
            libtiff-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.34"
          pip install "buildozer==1.6.0"

      - name: Prepare Buildozer Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          mv /tmp/cmdline-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/apkanalyzer" \
            "$SDK/tools/bin/apkanalyzer"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

      - name: Install Android SDK components
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;37.0.0"

      - name: Verify SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK: $SDK"
          echo "sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo "AIDL:"
          find "$SDK/build-tools" -name aidl -type f -print

      - name: Build APK
        working-directory: android_app
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldScalper-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
