name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Gold Scalper APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libwebp-dev \
            libtiff-dev

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools-linux-13114758_latest.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list | head -50
          echo "Checking AIDL..."
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print

      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Cython
        run: |
          pip install "Cython==0.29.34"

      - name: Install Buildozer
        run: |
          pip install "buildozer==1.6.0"

      - name: Build APK
        working-directory: android_app
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Scalper-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
